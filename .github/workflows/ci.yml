name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wa
          POSTGRES_PASSWORD: wa
          POSTGRES_DB: wa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wa"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wa:wa@localhost:5432/wa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @wa/web build
